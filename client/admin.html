<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Portfolio 2026</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>" />
</head>
<body>

  <!-- Aurora Orbs -->
  <div class="aurora-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- ── Login Screen ───────────────────────────────────────────────── -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card glass-card">
      <div class="login-logo">
        <span class="logo-bracket">&lt;</span>Admin<span class="logo-bracket">/&gt;</span>
      </div>
      <h1 class="login-title">Portfolio Admin</h1>
      <p class="login-subtitle">Sign in to manage your portfolio</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="admin-username" class="form-label">Username</label>
          <input type="text" id="admin-username" class="form-input" placeholder="admin" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="admin-password" class="form-label">Password</label>
          <div class="password-field">
            <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
        </button>
        <div id="loginError" class="form-status" role="alert"></div>
      </form>

      <a href="/" class="back-link">← Back to Portfolio</a>
    </div>
  </div>

  <!-- ── Admin Dashboard ────────────────────────────────────────────── -->
  <div class="admin-dashboard" id="adminDashboard" style="display:none">

    <!-- Admin Navbar -->
    <nav class="admin-navbar">
      <div class="admin-nav-inner">
        <a href="/" class="nav-logo" aria-label="Back to portfolio">
          <span class="logo-bracket">&lt;</span>JKM<span class="logo-bracket">/&gt;</span>
        </a>
        <div class="admin-nav-title">Admin Dashboard</div>
        <button class="btn btn-outline" id="logoutBtn" style="padding: 8px 20px; font-size:0.85rem;">
          Sign Out
        </button>
      </div>
    </nav>

    <div class="admin-main">

      <!-- Stats Row -->
      <div class="admin-stats-row" id="adminStats">
        <div class="admin-stat-card">
          <span class="admin-stat-num" id="stat-proj-count">—</span>
          <span class="admin-stat-label">Projects</span>
        </div>
        <div class="admin-stat-card">
          <span class="admin-stat-num" id="stat-skill-count">—</span>
          <span class="admin-stat-label">Skills</span>
        </div>
        <div class="admin-stat-card">
          <span class="admin-stat-num" id="stat-featured-count">—</span>
          <span class="admin-stat-label">Featured</span>
        </div>
      </div>

      <!-- Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="projects" id="tab-projects">📁 Projects</button>
        <button class="admin-tab" data-tab="skills" id="tab-skills">⚡ Skills</button>
      </div>

      <!-- ── Projects Tab ─────────────────────────────────────────── -->
      <div class="tab-panel active" id="panel-projects">
        <div class="panel-header">
          <h2 class="panel-title">Projects</h2>
          <button class="btn btn-primary" id="addProjectBtn" style="padding: 10px 22px; font-size:0.875rem;">
            + Add Project
          </button>
        </div>

        <div id="projectsList" class="admin-list">
          <div class="loading-spinner"><div class="spinner"></div><span>Loading...</span></div>
        </div>
      </div>

      <!-- ── Skills Tab ───────────────────────────────────────────── -->
      <div class="tab-panel" id="panel-skills">
        <div class="panel-header">
          <h2 class="panel-title">Skills</h2>
          <button class="btn btn-primary" id="addSkillBtn" style="padding: 10px 22px; font-size:0.875rem;">
            + Add Skill
          </button>
        </div>

        <div id="skillsList" class="admin-list">
          <div class="loading-spinner"><div class="spinner"></div><span>Loading...</span></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Modal ──────────────────────────────────────────────────────── -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true" style="display:none">
    <div class="modal-content glass-card" id="modalContent">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Add Project</h3>
        <button class="modal-close" id="modalClose" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ── Toast ──────────────────────────────────────────────────────── -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script src="js/admin.js"></script>
</body>
</html>
